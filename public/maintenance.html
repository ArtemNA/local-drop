<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local File Transfer - Maintenance</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%234CAF50' d='M9 16.17L4.83 12l-1.42 1.41L9 19L21 7l-1.41-1.41L9 16.17z'/%3E%3C/svg%3E">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0f0f1a;
            color: #e0e0e0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        .maintenance {
            text-align: center;
            padding: 40px 24px;
            max-width: 480px;
        }

        .icon {
            font-size: 64px;
            margin-bottom: 24px;
            animation: spin 4s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        h1 {
            font-size: 1.8em;
            margin-bottom: 12px;
            color: #fff;
        }

        p {
            font-size: 1.05em;
            line-height: 1.6;
            color: #999;
            margin-bottom: 8px;
        }

        .hint {
            margin-top: 32px;
            font-size: 0.8em;
            color: #555;
        }
    </style>
</head>
<body>
    <div class="maintenance">
        <div class="icon">&#x2699;</div>
        <h1>Maintenance in progress</h1>
        <p>We're updating the service. It'll be back shortly.</p>
        <p class="hint">Try refreshing in a minute or two.</p>
    </div>
</body>
</html>
