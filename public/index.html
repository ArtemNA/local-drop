<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local File Transfer - P2P</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%234CAF50' d='M9 16.17L4.83 12l-1.42 1.41L9 19L21 7l-1.41-1.41L9 16.17z'/%3E%3C/svg%3E">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header>
            <h1>📡 Local File Transfer</h1>
            <p class="subtitle">P2P file sharing in your local network</p>
            <div class="status-bar">
                <span class="status-indicator" id="connectionStatus">
                    <span class="status-dot"></span>
                    <span id="statusText">Connecting...</span>
                </span>
                <button id="deviceNameBtn" class="device-name-btn">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                        <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
                    </svg>
                    <span id="deviceName">Device</span>
                </button>
            </div>
        </header>

        <!-- Device List -->
        <section class="devices-section">
            <h2>Available Devices</h2>
            <div id="devicesList" class="devices-grid">
                <div class="no-devices">
                    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <rect x="5" y="2" width="14" height="20" rx="2" ry="2"></rect>
                        <line x1="12" y1="18" x2="12" y2="18"></line>
                    </svg>
                    <p>No other devices found</p>
                    <small>Make sure devices are on the same network</small>
                </div>
            </div>
        </section>

        <!-- Transfer Queue -->
        <section class="queue-section" id="queueSection" style="display: none;">
            <h2>Transfer Queue</h2>
            <div id="transferQueue" class="transfer-queue"></div>
        </section>

        <!-- Drop Zone (hidden by default) -->
        <div id="dropZone" class="drop-zone hidden">
            <div class="drop-zone-content">
                <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                    <polyline points="7 10 12 15 17 10"></polyline>
                    <line x1="12" y1="15" x2="12" y2="3"></line>
                </svg>
                <h3>Drop files here</h3>
                <p>Files will be sent to <span id="dropTargetName">device</span></p>
                <div id="previewArea" class="preview-area"></div>
                <div class="drop-zone-actions">
                    <button id="sendFilesBtn" class="btn btn-primary" style="display: none;">Send Files</button>
                    <button id="cancelDropBtn" class="btn btn-secondary">Cancel</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Name Edit Modal -->
    <div id="nameModal" class="modal hidden">
        <div class="modal-content">
            <h3>Change Device Name</h3>
            <input type="text" id="nameInput" maxlength="30" placeholder="Enter device name">
            <div class="modal-actions">
                <button id="saveNameBtn" class="btn btn-primary">Save</button>
                <button id="cancelNameBtn" class="btn btn-secondary">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div id="toastContainer" class="toast-container"></div>

    <script src="app.js"></script>
</body>
</html>
